title: Raku Ramblings
description: Notes on Raku, Linux, PDF, and whatever else seems interesting.
url: "https://raku-ramblings.blog"

markdown: kramdown

theme: minima

permalink: /:title/

header_pages:
  - raku.md
  - about.md
  - linux.md

sass:
  style: compressed---
---

@import "minima";

body {
    font-size: 18px;
    line-height: 1.65;
}

.wrapper {
    max-width: 900px;
}

.site-header {
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
}

.site-title {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0;
}

.site-nav .page-link {
    font-size: 1rem;
    margin-left: 1.25rem;
}

.page-content {
    padding-top: 2rem;
}

.post-title,
.page-heading,
h1,
h2,
h3 {
    line-height: 1.25;
}

.post-title {
    font-size: 2.4rem;
}

h2 {
    margin-top: 2rem;
}

pre,
code {
    font-size: 0.95em;
}

pre {
    padding: 1rem;
    overflow-x: auto;
}

blockquote {
    font-size: 1.05em;
}
